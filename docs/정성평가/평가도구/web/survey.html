<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보험 탭 사용성 평가</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --surface-2:#f0f2f5; --line:#dfe3e8;
    --text:#16202c; --text-2:#59636e; --text-3:#8a939d;
    --accent:#0046ff; --accent-soft:#e8efff;
    --mod:#fff8e6; --mod-line:#e8d9a8; --mod-text:#7a5c00;
    --ok:#0a7d4b; --warn:#b3261e;
    --r:12px; --r-sm:8px;
    --fs-q:17px; --fs-body:15px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#12161c; --surface:#1a2028; --surface-2:#222a34; --line:#333d4a;
      --text:#e9edf2; --text-2:#a3aeba; --text-3:#78838f;
      --accent:#6f9dff; --accent-soft:#1e2a44;
      --mod:#2b2618; --mod-line:#4d442a; --mod-text:#e0c876;
      --ok:#4ade80; --warn:#ff8a80;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161c; --surface:#1a2028; --surface-2:#222a34; --line:#333d4a;
    --text:#e9edf2; --text-2:#a3aeba; --text-3:#78838f;
    --accent:#6f9dff; --accent-soft:#1e2a44;
    --mod:#2b2618; --mod-line:#4d442a; --mod-text:#e0c876;
    --ok:#4ade80; --warn:#ff8a80;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,sans-serif;
    font-size:var(--fs-body); line-height:1.6; margin:0;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px; margin:0 auto; padding:0 16px 120px}

  /* ── 상단 진행 바 ── */
  header{
    position:sticky; top:0; z-index:10; background:var(--bg);
    border-bottom:1px solid var(--line); margin:0 -16px; padding:10px 16px 8px;
  }
  .hrow{display:flex; align-items:center; gap:10px; justify-content:space-between}
  .who{font-size:13px; color:var(--text-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who b{color:var(--text); font-weight:600}
  .bar{height:4px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:8px}
  .bar>i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease}
  .steps{font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums}

  /* ── 섹션/문항 ── */
  .sec{margin:22px 0 10px}
  .sec h2{font-size:13px; font-weight:700; color:var(--accent); margin:0 0 2px; letter-spacing:.02em}
  .sec p{margin:0; font-size:13px; color:var(--text-2)}

  .q{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; margin:12px 0;
  }
  .q > .qh{display:flex; gap:8px; align-items:baseline; margin-bottom:12px}
  .qn{font-size:13px; font-weight:700; color:var(--text-3); flex:none; font-variant-numeric:tabular-nums}
  .qt{font-size:var(--fs-q); font-weight:600; line-height:1.45}
  .qhint{font-size:13px; color:var(--text-2); margin:-6px 0 12px 28px}

  /* ── 진행자 안내 (참가자에게 읽어주거나 진행자만 보는 지시) ── */
  .guide{
    display:flex; gap:8px; align-items:flex-start;
    background:var(--mod); border:1px solid var(--mod-line); border-radius:var(--r-sm);
    padding:10px 12px; margin:12px 0 4px; font-size:13px; color:var(--mod-text); line-height:1.5;
  }
  .guide b{flex:none}
  .obsnote{
    background:var(--surface-2); border-radius:var(--r-sm); padding:14px 16px;
    color:var(--text-2); font-size:14px; text-align:center;
  }

  /* ── 화면 이미지: 폰 프레임 안에서 스크롤 ──
     UI 스크린샷은 세로로 길다(393×1674). 축소해 끼우면 띠가 되므로 원본 폭으로 두고
     프레임 안을 실제 폰처럼 위아래로 넘기게 한다. "크게 보기"는 전체 화면(역시 스크롤) */
  .stage{margin:12px 0 4px}
  .phones{display:grid; grid-template-columns:1fr; gap:10px}
  .phones.two{grid-template-columns:1fr 1fr}
  .phone{
    position:relative; height:46vh; overflow:hidden; display:flex; flex-direction:column;
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px;
  }
  /* 이름표는 프레임 위 띠로 — 스크린샷 위에 얹으면 앱 헤더를 가린다 */
  .phone .phead{
    flex:none; font-size:12px; font-weight:700; color:var(--accent); text-align:center;
    background:var(--surface); border-bottom:1px solid var(--line); padding:5px 10px;
  }
  .phone .scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  .phone img{display:block; width:100%; height:auto}
  .phone .ph{
    display:grid; place-items:center; height:100%; text-align:center;
    color:var(--text-3); font-size:13px; line-height:1.5;
  }
  .phone .ph small{display:block; font-size:11px; opacity:.8; margin-top:4px; font-family:ui-monospace,Menlo,monospace}
  .phone .full{
    position:absolute; right:8px; bottom:8px; z-index:2;
    background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:99px;
    padding:6px 11px; font:inherit; font-size:12px; font-weight:600; cursor:pointer;
  }
  .stagefoot{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px}
  .stagehint{font-size:12px; color:var(--text-3)}
  .collapse{
    background:none; border:1px solid var(--line); border-radius:99px;
    padding:4px 11px; font:inherit; font-size:12px; color:var(--text-2); cursor:pointer;
  }
  .zoom{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.92); overflow-y:auto; -webkit-overflow-scrolling:touch}
  .zoom img{display:block; width:min(100%,480px); margin:0 auto}
  .zoom .close{
    position:fixed; top:12px; right:12px; z-index:101;
    background:rgba(255,255,255,.92); color:#111; border:none; border-radius:99px;
    padding:8px 14px; font:inherit; font-weight:700; cursor:pointer;
  }

  /* 폰(좁은 화면): 프레임을 위에 붙이고 접을 수 있게 — 문항을 내려가며 답하는 동안 화면이 사라지지 않는다 */
  .split .stage{
    position:sticky; top:50px; z-index:5; background:var(--bg);
    margin:0 -16px 8px; padding:6px 16px 6px;
  }
  .split .phone{height:42vh}
  .split .phones.two .phone{height:36vh}
  .split .stage.collapsed .phone{height:0; border:none}
  .split .stage.collapsed .stagehint{display:none}
  .split .stage.collapsed .stagefoot{margin-top:0}

  /* 태블릿·노트북: 왼쪽에 프레임 고정, 오른쪽에 문항 */
  @media (min-width:900px){
    .wrap{max-width:1060px}
    .split{display:grid; grid-template-columns:393px minmax(0,1fr); gap:28px; align-items:start}
    .split .stage{position:sticky; top:64px; margin:12px 0 0; padding:0; background:none}
    .split .phone, .split .phones.two .phone{height:calc(100dvh - 200px)}
    .split .phones.two{grid-template-columns:1fr; }
    .split .phones.two .phone{height:calc(50dvh - 110px)}
    .collapse{display:none}
  }

  /* ── 역할 안내 ── */
  .role{
    background:var(--accent-soft); border:1px solid var(--line); border-radius:var(--r);
    padding:18px; margin:14px 0;
  }
  .role .lbl{font-size:12px; font-weight:700; color:var(--accent); margin-bottom:8px}
  .role p{margin:0; font-size:17px; font-weight:600; line-height:1.6}
  .role ul{margin:12px 0 0; padding-left:20px; font-size:15px}
  .role li{margin:4px 0}

  /* ── 아이디어 섹션 표지 ── */
  .divider{padding:28px 0 8px}
  .divider .idx{font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.02em}
  .divider h1{font-size:24px; margin:8px 0 6px; line-height:1.3}
  .divider .lead{color:var(--text-2); font-size:14px; margin:0 0 16px}
  .divider .task{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; margin:10px 0; font-size:14px; line-height:1.55;
  }
  .divider .task b{color:var(--accent)}

  /* ── 선택지 ── */
  .opts{display:flex; flex-direction:column; gap:8px}
  .opt{
    display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
    background:var(--surface-2); border:1.5px solid transparent; border-radius:var(--r-sm);
    padding:13px 14px; font:inherit; color:var(--text); cursor:pointer;
    transition:background .12s, border-color .12s, transform .06s;
  }
  .opt:hover{background:var(--accent-soft)}
  .opt:active{transform:scale(.99)}
  .opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .opt .mark{
    flex:none; width:20px; height:20px; border-radius:50%; border:2px solid var(--line);
    display:grid; place-items:center; margin-top:1px;
  }
  .opt[aria-pressed="true"] .mark{border-color:var(--accent); background:var(--accent)}
  .opt[aria-pressed="true"] .mark::after{content:""; width:7px; height:7px; border-radius:50%; background:#fff}
  .opt.multi .mark{border-radius:5px}
  .opt.multi[aria-pressed="true"] .mark::after{
    content:""; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0;
    transform:rotate(45deg) translateY(-1px); border-radius:0; background:none;
  }
  .follow{font-size:13px; font-weight:600; margin:16px 0 6px; color:var(--text-2)}

  /* ── 척도 ── */
  .scale{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
  .scale button{
    background:var(--surface-2); border:1.5px solid transparent; border-radius:var(--r-sm);
    padding:12px 4px 10px; font:inherit; color:var(--text); cursor:pointer; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    transition:background .12s, border-color .12s, transform .06s;
  }
  .scale button:hover{background:var(--accent-soft)}
  .scale button:active{transform:scale(.97)}
  .scale button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .scale .num{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums}
  .scale .cap{font-size:11px; line-height:1.25; color:var(--text-2); word-break:keep-all}
  .scale button[aria-pressed="true"] .num,
  .scale button[aria-pressed="true"] .cap{color:var(--accent)}
  .pairlbl{font-size:13px; font-weight:600; margin:12px 0 6px; color:var(--text-2)}
  .pairlbl:first-child{margin-top:0}

  /* ── 주관식 ── */
  textarea{
    width:100%; min-height:96px; resize:vertical; font:inherit; font-size:15px;
    background:var(--surface-2); color:var(--text);
    border:1.5px solid var(--line); border-radius:var(--r-sm); padding:12px;
    line-height:1.55;
  }
  textarea.short{min-height:64px}
  textarea::placeholder{color:var(--text-3)}
  textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .other-in{
    width:100%; font:inherit; font-size:15px; margin-top:8px; padding:11px 12px;
    background:var(--surface-2); color:var(--text);
    border:1.5px solid var(--line); border-radius:var(--r-sm);
  }
  .other-in:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}

  /* ── 진행자 칸 ── */
  .mod{
    background:var(--mod); border:1px dashed var(--mod-line); border-radius:var(--r-sm);
    padding:13px 14px; margin-top:14px;
  }
  .mod .mh{
    display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    color:var(--mod-text); margin-bottom:9px; letter-spacing:.02em;
  }
  .mod .mh svg{flex:none}
  .mod .mrow{display:flex; flex-wrap:wrap; gap:7px}
  .mod button{
    background:var(--surface); border:1.5px solid var(--mod-line); border-radius:99px;
    padding:8px 14px; font:inherit; font-size:14px; color:var(--text); cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .mod button:hover{border-color:var(--mod-text)}
  .mod button[aria-pressed="true"]{background:var(--mod-text); border-color:var(--mod-text); color:var(--mod)}
  .mod .mnote{font-size:12px; color:var(--mod-text); margin-top:8px; opacity:.85}

  /* ── 버튼 ── */
  .nav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .navin{max-width:720px; margin:0 auto; display:flex; gap:10px}
  .btn{
    flex:1; border:none; border-radius:var(--r-sm); padding:15px 16px;
    font:inherit; font-size:16px; font-weight:700; cursor:pointer;
    transition:filter .12s, transform .06s;
  }
  .btn:active{transform:scale(.99)}
  .btn-p{background:var(--accent); color:#fff}
  .btn-p:hover{filter:brightness(1.08)}
  .btn-s{flex:0 0 96px; background:var(--surface-2); color:var(--text)}
  .btn-s:hover{filter:brightness(.96)}
  .btn:disabled{opacity:.45; cursor:not-allowed}

  /* ── 시작/종료 화면 ── */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin:16px 0}
  .card h1{font-size:22px; margin:0 0 6px; line-height:1.3}
  .card .lead{color:var(--text-2); margin:0 0 20px; font-size:14px}
  .field{margin-bottom:18px}
  .field > label{display:block; font-size:14px; font-weight:600; margin-bottom:8px}
  .field .req{color:var(--warn); margin-left:3px}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .seg button{
    background:var(--surface-2); border:1.5px solid transparent; border-radius:var(--r-sm);
    padding:14px 10px; font:inherit; font-size:15px; color:var(--text); cursor:pointer;
  }
  .seg button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); font-weight:700; color:var(--accent)}
  .seg .sm{display:block; font-size:12px; color:var(--text-2); margin-top:2px; font-weight:400}
  .seg button[aria-pressed="true"] .sm{color:var(--accent)}
  input[type=text]{
    width:100%; font:inherit; font-size:15px; padding:13px 12px;
    background:var(--surface-2); color:var(--text);
    border:1.5px solid var(--line); border-radius:var(--r-sm);
  }
  input[type=text]:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .warnbox{
    background:var(--mod); border:1px solid var(--mod-line); border-radius:var(--r-sm);
    padding:12px 14px; font-size:13px; color:var(--mod-text); margin-top:16px; line-height:1.55;
  }
  .savedrow{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .savedrow:last-child{border-bottom:none}
  .savedrow .meta{font-size:12px; color:var(--text-2); font-variant-numeric:tabular-nums}
  .ghost{
    background:none; border:1px solid var(--line); border-radius:var(--r-sm);
    padding:10px 14px; font:inherit; font-size:14px; color:var(--text-2); cursor:pointer;
  }
  .ghost:hover{border-color:var(--accent); color:var(--accent)}
  .done{text-align:center; padding:32px 0 8px}
  .done .ic{width:56px; height:56px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:grid; place-items:center; margin:0 auto 14px; font-size:28px}
  @media (max-width:420px){
    .scale{gap:4px}
    .scale .cap{font-size:10px}
    .btn-s{flex:0 0 80px}
  }
</style>

<div class="wrap">
  <header id="hd" hidden>
    <div class="hrow">
      <div class="who" id="who"></div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="bar"><i id="prog" style="width:0%"></i></div>
  </header>
  <main id="main"></main>
</div>
<div class="nav" id="nav" hidden><div class="navin" id="navin"></div></div>

<script>
/* ══════════════════════════════════════════════════════════
   9/11 정성평가 — 아이디어 1·2·3 순서로 진행한다 (아이디어 4 청구는 별도 개정 예정, 미포함).
   각 아이디어 앞에 표지 섹션(이름 + 과업/역할 안내)을 넣는다.

   아이디어 1 · 상품 찾기        — 역할 없음. 실기기로 기존/두 번째 화면 각각 과업 수행
   아이디어 2 · 보험 탭 홈 개인화 — 역할 부여(보험 2개 20대), 스크린샷 2장 블라인드 비교
   아이디어 3 · 보장진단        — 역할 유지(되짚기), 프로토타입에서 직접 조작, 이름부터 물어 블라인드 아님

   홈·보장 블록 순서는 참가자 번호 홀짝으로 교차한다.
   응답은 순서가 아니라 정체(기존/우리)로 저장한다 — 집계가 바로 되게.
   ══════════════════════════════════════════════════════════ */
const SIDES={
  old :{csv:'기존', name:'보장에너지', file:'img/home-existing.png', app:'기존 슈퍼SOL'},
  ours:{csv:'우리', name:'보장진단',   file:'img/home-ours.png',     app:'두 번째 화면'},
};
/* 값은 목데이터(상태 B)와 같아야 한다 — 화면에 뜨는 숫자와 역할이 어긋나면 "내 얘기가 아니다"가 된다 */
const ROLE={
  lead:'지금부터 당신은 이런 사람이에요.',
  facts:['20대','보험을 2개 가지고 있어요','매달 3만 5천 원쯤 보험료를 내요'],
  tail:'지금부터 보여드리는 두 화면은 그런 당신이 보는 보험 탭이에요. 이 사람이라고 생각하고 봐주세요.',
};
const ROLE2='계속 같은 사람이에요 — 20대, 보험 2개, 매달 3만 5천 원. 이제 이 사람의 보험 상태를 보여주는 서비스를 두 개 보실 거예요.';

/* ── 아이디어 섹션 표지 — 이름 + 역할/과업 안내만. 문항이 아니라 진행자가 읽어주는 페이지 ──
   ⚠️ 아이디어 1 은 Task1·Task2 를 한 표지에 같이 보여주지 않는다.
   Task2(G1b 자유 발견)가 Task1 단계에서 미리 안내되면 "스스로 발견했는지"가 오염된다.
   그래서 아이디어 1 은 표지가 두 장이다 — Task1 표지 → Task1 진행 → Task2 표지 → Task2 진행 */
const IDEAS=[
 {id:'idea1', idx:'아이디어 1', title:'보험 상품 찾기', role:false, orderNote:true,
  lead:'지금부터는 역할 없이, 참가자님 그대로 진행합니다.',
  tasks:[{lbl:'Task 1', txt:'신한라이프 치아보험 1개, 타사 치아보험 1개를 찾아서 각각 열어봐 주세요.', sub:'두 상품의 순서는 상관없습니다. 두 화면 모두에서 같은 과제를 합니다.'}]},

/* ══ 상태 ══ */
const LS='sol_survey_v2';
const blank=()=>({p:'',order:'',orderTouched:false,moderator:'',started:'',
                  ans:{old:{},ours:{},cmp:{}},mod:{old:{},ours:{},cmp:{}},i:0});
let S=blank();
let view='intro';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pnum=()=>parseInt(String(S.p).replace(/\D/g,''),10);
/* 홀수 = 기존 먼저, 짝수 = 우리 먼저 */
const autoOrder=()=>{const n=pnum(); return Number.isFinite(n)&&n%2===0?'ours-first':'old-first';};
const seqOf=o=>o==='ours-first'?['ours','old']:['old','ours'];
const seq=()=>seqOf(S.order);
/* {name} 치환 + 받침에 따라 "이라는/라는" — 보장진단이라는 · 보장에너지라는 */
const hasJong=w=>{const c=w.charCodeAt(w.length-1); return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;};
const fill=(s,key)=>String(s??'').replace('{name}', key&&SIDES[key]?SIDES[key].name:'')
  .replace(/"([^"]+)"이라는/g,(m,n)=>`"${n}"${hasJong(n)?'이라는':'라는'}`);
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]}};
const save=r=>{try{const a=load(); a.push(r); localStorage.setItem(LS,JSON.stringify(a)); return true}catch(e){return false}};
/* 진행 중 임시 저장 — 50단계를 폰에서 하다 탭이 죽으면 전부 날아간다. 매 입력·이동마다 적고, 제출하면 지운다 */
const DRAFT='sol_survey_v2_draft';
const saveDraft=()=>{ if(view!=='quiz') return; try{localStorage.setItem(DRAFT,JSON.stringify(S))}catch(e){} };
const loadDraft=()=>{try{const d=JSON.parse(localStorage.getItem(DRAFT)); return d&&d.p?d:null}catch(e){return null}};
const dropDraft=()=>{try{localStorage.removeItem(DRAFT)}catch(e){}};

/* 진행 순서
   [표지: 아이디어1] 상품찾기 Task1 Q1~Q3 → Task2 G1·G1b → (분기) G2~G6 또는 G7
   [표지: 아이디어2] 역할 → 홈 화면1 P×5 → 홈 화면2 P×5 → C×4
   [표지: 아이디어3] 역할 되짚기 → 이름 T×2 ×2 → T5 → 서비스1 A×7 → 서비스2 A×7 → E×2 → D×4

   G1b 는 참가자가 직접 답한 값으로 분기한다(진행자 개입 없음) — v===0(눌러봤다)이면 G_USED,
   그 외(못 봤거나 안 눌러봤다)면 G_UNUSED 로 간다. steps() 는 매 렌더마다 다시 계산되므로
   G1b 응답 직후 다음 단계에서 바로 반영된다. */
function branch(){ return S.ans.cmp?.G1b?.v===0 ? 'used' : 'unused'; }

function steps(){
  const st=[];

  /* ── 배경 ── */
  B.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'시작하기 전에', secNote:'참가자님에 대해 두 가지만 여쭤볼게요'}));

  /* ── 아이디어 1 · Task1 상품 찾기 ── */
  st.push({kind:'divider', idea:IDEAS[0]});
  PR.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'Task 1 · 상품 찾기'}));

  /* ── 아이디어 1 · Task2 상품 상세 에이전트 ── 별도 표지 뒤에 이어간다.
     Task1 표지에 Task2 안내가 같이 보이면 "스스로 발견했는지"가 오염되므로 표지를 나눈다 */
  st.push({kind:'divider', idea:IDEAS[1]});
  G1.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'Task 2 · 상품 상세에서 알아보기'}));
  const gset = branch()==='used' ? G_USED : G_UNUSED;
  gset.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'Task 2 · 상품 상세에서 알아보기'}));

  /* ── 아이디어 2 · 홈 개인화 ── */
  st.push({kind:'divider', idea:IDEAS[2]});
  st.push({kind:'role'});
  /* 화면 하나당 한 페이지 — 프레임을 보면서 P1~P5 를 이어서 답한다 */
  seq().forEach((key,nth)=>st.push({kind:'screen',key,nth,qs:P,
    sec:nth===0?'첫 번째 화면':'두 번째 화면', secNote:'화면을 보면서 답해주세요'}));
  C.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'두 화면 비교', secNote:'두 화면을 다 보셨어요'}));

  /* ── 아이디어 3 · 보장진단 ── */
  st.push({kind:'divider', idea:IDEAS[3]});
  st.push({kind:'role2'});
  seq().forEach((key,nth)=>T.forEach((q,i)=>st.push({kind:'svc',key,nth,q, label:'T'+(i+1+nth*T.length),
    sec:'이름만 보고', secNote:'아직 아무 화면도 보지 않았어요'})));
  st.push({kind:'cmp',key:'cmp',q:T5, sec:'이름만 보고'});
  seq().forEach((key,nth)=>A.forEach((q,i)=>st.push({kind:'svc',key,nth,q, label:(nth===0?'A':'B')+(i+1),
    sec:`${nth===0?'첫 번째':'두 번째'} 서비스 · ${SIDES[key].name}`, secNote:'홈의 카드에서 시작합니다'})));
  E.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'두 서비스를 다 본 뒤', secNote:'또래 비교 부분에 대해'}));
  D.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'두 서비스 비교'}));

  /* ── 마무리 ── */
  F.forEach(q=>st.push({kind:'cmp',key:'cmp',q, sec:'마무리', secNote:'오늘 본 두 화면 전체에 대해'}));

  return st;
}

/* ══ 렌더 ══ */
function render(){
  if(view==='intro') return intro();
  if(view==='done')  return done();
  quiz();
}

function intro(){
  $('#hd').hidden=true; $('#nav').hidden=true;
  const saved=load(), draft=loadDraft();
  $('#main').innerHTML=`
  <div class="card">
    <h1>보험 탭 사용성 평가</h1>
    <p class="lead">진행자가 참가자 정보를 먼저 입력합니다.</p>

    <div class="field">
      <label for="pin">참가자 번호<span class="req">*</span></label>

    </div>

    <div class="field">
      <label>순서<span class="req">*</span> <span style="font-weight:400;color:var(--text-3);font-size:12px">번호를 넣으면 자동으로 정해져요 · 두 블록 공통</span></label>
      <div class="seg" id="segOrder">
        <button type="button" data-v="old-first" aria-pressed="${S.order==='old-first'}">기존 먼저<span class="sm">홀수 · P1·P3·P5·P7</span></button>
        <button type="button" data-v="ours-first" aria-pressed="${S.order==='ours-first'}">우리 먼저<span class="sm">짝수 · P2·P4·P6·P8</span></button>
      </div>
    </div>

    <div class="field">
      <label for="modin">진행자</label>
      <input type="text" id="modin" placeholder="이름 또는 이니셜" value="${esc(S.moderator)}" autocomplete="off">
    </div>

    <div class="warnbox">
      아이디어 1(상품 찾기)은 역할 없이 실기기로 진행합니다.<br>
      아이디어 2(홈)는 두 화면을 <b>"첫 번째 화면 · 두 번째 화면"</b>으로만 부릅니다. 어느 쪽이 기존인지 말하지 않습니다.<br>
      아이디어 3(보장)은 이름(보장에너지·보장진단)을 먼저 묻기 때문에 블라인드가 아닙니다.<br>
      아이디어 2·3 모두 같은 역할(20대·보험 2개)을 이어서 씁니다.<br>
      응답은 이 브라우저에만 저장되니, 참가자 한 명이 끝날 때마다 CSV로 내려받으세요.
    </div>
  </div>

  ${draft?`<div class="card">
    <h1 style="font-size:16px">진행 중이던 응답이 있어요</h1>
    <div class="savedrow"><span><b>${esc(draft.p)}</b> · ${draft.i+1}번째 화면에서 멈춤</span>
      <span class="meta">${esc((draft.started||'').slice(5,16).replace('T',' '))}</span></div>
    <div style="display:flex; gap:8px; margin-top:14px">
      <button class="btn btn-p" style="flex:1;padding:12px" id="resume">이어서 하기</button>
      <button class="ghost" id="dropdraft">버리기</button>
    </div>

  ${saved.length?`<div class="card">
    <h1 style="font-size:16px">저장된 응답 ${saved.length}건</h1>
    ${saved.map(r=>`<div class="savedrow">
      <span><b>${esc(r.p||'?')}</b> · ${r.order==='ours-first'?'우리 먼저':'기존 먼저'}</span>
      <span class="meta">${esc((r.started||'').slice(5,16).replace('T',' '))}</span>
    </div>`).join('')}
    <div style="display:flex; gap:8px; margin-top:14px">
      <button class="ghost" style="flex:1" id="csv">CSV 내려받기</button>
      <button class="ghost" id="clr">전체 삭제</button>

  $('#nav').hidden=false;
  $('#navin').innerHTML=`<button class="btn btn-p" id="go">시작하기</button>`;

  const paintOrder=()=>[...$('#segOrder').children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===S.order));
  const sync=()=>{ $('#go').disabled = !($('#pin').value.trim() && S.order); };
  $('#pin').oninput=e=>{S.p=e.target.value.trim(); if(!S.orderTouched){S.order=autoOrder(); paintOrder();} sync()};
  $('#modin').oninput=e=>{S.moderator=e.target.value.trim()};
  $('#segOrder').onclick=e=>{const b=e.target.closest('button'); if(!b)return;
    S.order=b.dataset.v; S.orderTouched=true; paintOrder(); sync()};
  if($('#csv')) $('#csv').onclick=csv;
  if($('#resume')) $('#resume').onclick=()=>{ S=draft; view='quiz'; render(); window.scrollTo(0,0) };

  $('#go').onclick=()=>{ S.started=new Date().toISOString(); S.i=0; view='quiz'; render(); window.scrollTo(0,0) };

/* 폰 프레임 — 파일이 없으면 자리표시. 참가자에게 보이는 이름표는 순서(첫/두 번째)뿐 */
function phone(key,nth,dict){
  const sc=(dict||SIDES)[key], tag=nth===0?'첫 번째 화면':'두 번째 화면';
  return `<div class="phone"><div class="phead">${tag}</div>
    <div class="scroll"><img src="${esc(sc.file)}" alt="${tag}"
      onerror="this.outerHTML='<div class=ph>${tag} 이미지 준비 중<small>${esc(sc.file)}</small></div>'"></div>
    <button type="button" class="full" data-full="${esc(sc.file)}">크게 보기</button>
  </div>`;
}
function stage(keys,dict){
  return `<div class="stage" id="stage">
    <div class="phones${keys.length>1?' two':''}">${keys.map((k,i)=>phone(k,i,dict)).join('')}</div>
    <div class="stagefoot"><span class="stagehint">화면 안에서 위아래로 넘겨 보세요</span>
      <button type="button" class="collapse" id="collapse">화면 접기</button></div>
  </div>`;
}
function bindStage(){
  document.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>{
    const z=document.createElement('div'); z.className='zoom';
    z.innerHTML=`<button type="button" class="close">닫기</button><img src="${esc(b.dataset.full)}" alt="">`;
    z.querySelector('.close').onclick=()=>z.remove();
    document.body.appendChild(z);
  });
  const c=$('#collapse'), s=$('#stage');
  if(c&&s) c.onclick=()=>{ const on=s.classList.toggle('collapsed'); c.textContent=on?'화면 펼치기':'화면 접기'; };
}

function quiz(){
  const list=steps(), st=list[S.i], prev=list[S.i-1];
  $('#hd').hidden=false; $('#nav').hidden=false;
  $('#who').innerHTML=`<b>${esc(S.p)}</b>${S.moderator?` · ${esc(S.moderator)}`:''}`;
  /* 분기에 따라 총 단계가 달라지므로 참가자에게는 % 만 보여준다 */
  $('#steps').textContent=`${Math.round((S.i+1)/list.length*100)}%`;
  $('#prog').style.width=((S.i+1)/list.length*100)+'%';

  let h='';
  if(st.kind==='divider'){
    const d=st.idea;
    h=`<div class="divider">
      <div class="idx">${esc(d.idx)}</div>
      <h1>${esc(d.title)}</h1>
      <p class="lead">${esc(d.lead)}${d.role?' 다음 화면에서 역할을 안내합니다.':''}</p>
      ${(d.tasks||[]).map(t=>`<div class="task"><b>${esc(t.lbl)}</b> · ${esc(t.txt)}${t.sub?`<div style="color:var(--text-2);margin-top:4px">${esc(t.sub)}</div>`:''}</div>`).join('')}
      ${d.orderNote?`<div class="task"><b>순서</b> · ${seq().map(k=>esc(SIDES[k].app)).join(' → ')} 순으로 진행합니다.</div>`:''}
    </div>`;
  }
  else if(st.kind==='role'){
    h=`<div class="sec"><h2>역할 안내</h2><p>천천히 읽어주세요</p></div>
    <div class="role">
      <div class="lbl">역할 안내</div>
      <p>${esc(ROLE.lead)}</p>
      <ul>${ROLE.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
      <p style="margin-top:14px;font-weight:500;font-size:15px">${esc(ROLE.tail)}</p>
    </div>`;
  }
  else if(st.kind==='role2'){
    h=`<div class="sec"><h2>역할 되짚기</h2><p>같은 역할로 이어갑니다</p></div>
    <div class="role"><div class="lbl">역할 되짚기</div><p>${esc(ROLE2)}</p></div>`;
  }
  else {
    const qs=st.qs||[st.q];
    let inner='';
    if(st.sec && (!prev||prev.sec!==st.sec||prev.kind==='divider'))
      inner+=`<div class="sec"><h2>${esc(st.sec)}</h2>${st.secNote?`<p>${esc(st.secNote)}</p>`:''}</div>`;
    if(st.task) inner+=`<div class="task"><b>${esc(st.task.lbl)}</b> · ${esc(st.task.txt)}${st.task.sub?`<div style="color:var(--text-2);margin-top:4px">${esc(st.task.sub)}</div>`:''}</div>`;
    inner+=qs.map(q=>qbox({...st,q})).join('');
    /* 화면 이미지가 있는 단계는 프레임 + 문항 2단(넓은 화면) / 프레임 위 고정(폰) */
    const keys = st.kind==='screen' ? [st.key] : (st.q&&st.q.thumbs ? seq() : null);
    h+= keys ? `<div class="split">${stage(keys,st.dict)}<div class="qs">${inner}</div></div>` : inner;
  }
  $('#main').innerHTML=h;
  (st.qs||(st.q?[st.q]:[])).forEach(q=>body(q, st.key));
  bindStage();

  $('#navin').innerHTML=`
    <button class="btn btn-s" id="back">이전</button>
    <button class="btn btn-p" id="next">${S.i===list.length-1?'제출':'다음'}</button>`;
  $('#back').disabled=S.i===0;
  $('#back').onclick=()=>{S.i--; render(); window.scrollTo(0,0)};
  $('#next').onclick=()=>{
    /* 선택형을 빈 채로 넘기면 집계에 빈칸이 생긴다. 분기점(G1b)은 아예 막고, 나머지는 한 번 확인한다 */
    for(const q of (st.qs||(st.q?[st.q]:[]))){
      const a=(S.ans[st.key]||{})[q.id]||{};
      const empty = (q.type==='choice'||q.type==='scale') ? a.v==null
                  : q.type==='multi' ? !(a.v&&a.v.length)
                  : q.type==='pair'  ? (a.r0==null||a.r1==null) : false;
      if(empty && q.required){ alert('이 문항은 답을 골라야 넘어갈 수 있어요.'); return; }
      if(empty && !confirm(`${q.id} 답을 고르지 않았어요. 그대로 넘어갈까요?`)) return;
    }
    if(S.i===list.length-1){ submit(); } else { S.i++; render(); window.scrollTo(0,0); }
  };
  saveDraft();
}

function qbox(st){
  const q=st.q, key=st.key;
  return `${q.guide?`<div class="guide"><b>안내</b><span>${esc(fill(q.guide,key))}</span></div>`:''}
    <div class="q"><div class="qh"><span class="qn">${esc(st.label||q.id)}</span>
      <span class="qt">${esc(fill(q.q,key))}</span></div>
      ${q.hint?`<div class="qhint">${esc(q.hint)}</div>`:''}
      <div class="body" data-q="${esc(q.id)}"></div>
      ${q.mod ? modBox(q,key) : ''}
      </div>`;
}

function modBox(q,key){
  const m=q.mod, cur=S.mod[key]?.[q.id];
  const sel=v=> m.multi ? (Array.isArray(cur)&&cur.includes(v)) : cur===v;
  return `<div class="mod">
    <div class="mh"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.6"/></svg>
      진행자 기록 · ${esc(m.label)}</div>
    <div class="mrow" id="mrow">
      ${m.opts.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${sel(o)}">${esc(o)}</button>`).join('')}
    </div>
    ${m.note?`<div class="mnote">${esc(m.note)}</div>`:''}
  </div>`;
}

function body(q,key){
  /* 한 페이지에 문항이 여러 개 올 수 있으니 id 대신 data-q 로 찾고, 안쪽 요소도 el 안에서만 찾는다 */
  const el=document.querySelector(`.body[data-q="${q.id}"]`); const store=S.ans[key]; const a=store[q.id]||{};

  if(q.type==='scale'){
    el.innerHTML=`<div class="scale">
      ${q.labels.map((L,i)=>`<button type="button" data-v="${i+1}" aria-pressed="${a.v===i+1}">
         <span class="num">${i+1}</span><span class="cap">${esc(L)}</span></button>`).join('')}
    </div>`;
    const g=el.querySelector('.scale');
    g.onclick=e=>{const b=e.target.closest('button'); if(!b)return;
      store[q.id]={v:+b.dataset.v}; [...g.children].forEach(c=>c.setAttribute('aria-pressed',c===b));};
  }
  else if(q.type==='pair'){
    const rows=q.pairLabels||['기존 슈퍼SOL','두 번째 화면'];
    el.innerHTML=rows.map((r,ri)=>`
      <div class="pairlbl">${esc(r)}</div>
      <div class="scale" data-row="${ri}" style="grid-template-columns:repeat(${q.labels.length},1fr)">
        ${q.labels.map((L,i)=>`<button type="button" data-v="${i+1}" aria-pressed="${a['r'+ri]===i+1}">
           ${q.nonum?'':`<span class="num">${i+1}</span>`}<span class="cap"${q.nonum?' style="font-size:13px;color:var(--text)"':''}>${esc(L)}</span></button>`).join('')}
      </div>`).join('');
    el.querySelectorAll('.scale').forEach(g=>{
      g.onclick=e=>{const b=e.target.closest('button'); if(!b)return;
        const v=+b.dataset.v, ri=g.dataset.row, cur=store[q.id]||{};
        cur['r'+ri]=v; store[q.id]=cur; [...g.children].forEach(c=>c.setAttribute('aria-pressed',c===b));};
    });
  }
  else if(q.type==='choice'||q.type==='multi'){
    const multi=q.type==='multi';
    el.innerHTML=`<div class="opts">
      ${q.opts.map((o,i)=>`<button type="button" class="opt${multi?' multi':''}" data-i="${i}"
        aria-pressed="${multi?(a.v||[]).includes(i):a.v===i}">
        <span class="mark"></span><span>${esc(o)}</span></button>`).join('')}
      ${q.other?`<button type="button" class="opt${multi?' multi':''}" data-i="-1"
        aria-pressed="${multi?(a.v||[]).includes(-1):a.v===-1}">
        <span class="mark"></span><span>기타</span></button>`:''}
    </div>
    ${q.other?`<input class="other-in" placeholder="기타 내용을 적어주세요" value="${esc(a.other||'')}" hidden>`:''}
    ${q.follow?`<div class="follow">${esc(q.follow.q)}</div>
      <textarea class="short" placeholder="${esc(q.follow.ph||'')}">${esc(a.follow||'')}</textarea>`:''}`;
    const oth=el.querySelector('.other-in');
    const showOther=()=>{ if(!oth)return; const c=store[q.id]||{};
      oth.hidden = multi ? !(c.v||[]).includes(-1) : c.v!==-1; };
    el.querySelector('.opts').onclick=e=>{
      const b=e.target.closest('.opt'); if(!b)return;
      const i=+b.dataset.i; const cur=store[q.id]||{};
      if(multi){ const arr=new Set(cur.v||[]); arr.has(i)?arr.delete(i):arr.add(i); cur.v=[...arr];
        b.setAttribute('aria-pressed',arr.has(i)); }
      else {
        /* 분기점 답이 바뀌면 반대 분기에 남아 있던 답을 비운다 — 되돌아가 바꿨을 때 유령 응답이 남지 않게 */
        if(q.branchKey && cur.v!==i) [...G_USED,...G_UNUSED].forEach(g=>delete S.ans.cmp[g.id]);
        cur.v=i; el.querySelectorAll('.opt').forEach(c=>c.setAttribute('aria-pressed',c===b));
      }
      store[q.id]=cur; showOther();
    };
    showOther();
    if(oth) oth.oninput=e=>{const c=store[q.id]||{}; c.other=e.target.value; store[q.id]=c};
    const fol=el.querySelector('textarea.short');
    if(fol) fol.oninput=e=>{const c=store[q.id]||{}; c.follow=e.target.value; store[q.id]=c};
  }
  else if(q.type==='obs'){
    /* 진행자 관찰 — 참가자 입력 없음 */
    el.innerHTML=`<div class="obsnote">진행자가 관찰해서 아래에 기록합니다</div>`;
  }
  else { /* text */
    el.innerHTML=`<textarea placeholder="${esc(q.ph||'자유롭게 적어주세요')}">${esc(a.v||'')}</textarea>`;
    el.querySelector('textarea').oninput=e=>{store[q.id]={v:e.target.value}};
  }

  const mr=el.parentElement.querySelector('.mrow');
  if(mr) mr.onclick=e=>{
    const b=e.target.closest('button'); if(!b)return;
    const v=b.dataset.v, m=q.mod, ms=S.mod[key];
    if(m.multi){ const arr=new Set(ms[q.id]||[]); arr.has(v)?arr.delete(v):arr.add(v);
      ms[q.id]=[...arr]; b.setAttribute('aria-pressed',arr.has(v)); }
    else { ms[q.id]=v; [...mr.children].forEach(c=>c.setAttribute('aria-pressed',c===b)); }
  };
}

function submit(){
  const rec={p:S.p,order:S.order,moderator:S.moderator,
             started:S.started,ended:new Date().toISOString(),ans:S.ans,mod:S.mod};
  const ok=save(rec);
  if(ok) dropDraft();
  view='done'; render(); window.scrollTo(0,0);
  if(!ok) alert('저장에 실패했습니다. 지금 바로 CSV를 내려받으세요.');
}

function done(){
  $('#hd').hidden=true;
  const n=load().length;
  $('#main').innerHTML=`<div class="card done">
    <div class="ic">✓</div>
    <h1>응답이 저장됐어요</h1>
    <p class="lead">참여해주셔서 감사합니다.</p>
    <div class="warnbox" style="text-align:left">
      진행자 확인: 지금 CSV를 내려받으세요. 저장된 응답은 ${n}건입니다.
      브라우저 데이터가 지워지면 복구할 수 없습니다.
    </div>
  </div>`;
  $('#navin').innerHTML=`
    <button class="btn btn-s" id="dl" style="flex:1">CSV 받기</button>
    <button class="btn btn-p" id="nx">다음 참가자</button>`;
  $('#dl').onclick=csv;
  $('#nx').onclick=()=>{const m=S.moderator; S=blank(); S.moderator=m;
    view='intro'; render(); window.scrollTo(0,0)};
}

/* ══ CSV ══
   열은 화면 순서가 아니라 정체(기존_/우리_)로 나간다.
   C1 의 "첫 번째/두 번째"와 T5·D1·D4 의 서비스 이름은 전부 기존/우리로 풀어서 적는다 */
const NAME2CSV={[SIDES.old.name]:'기존',[SIDES.ours.name]:'우리'};
function walk(cb){
  B.forEach(q=>cb(q,'cmp',q.id));
  PR.forEach(q=>cb(q,'cmp',q.id));
  G1.forEach(q=>cb(q,'cmp',q.id));
  G_USED.forEach(q=>cb(q,'cmp',q.id));
  G_UNUSED.forEach(q=>cb(q,'cmp',q.id));
  ['old','ours'].forEach(k=>P.forEach(q=>cb(q,k,SIDES[k].csv+'_'+q.id)));
  C.forEach(q=>cb(q,'cmp',q.id));
  ['old','ours'].forEach(k=>T.forEach(q=>cb(q,k,SIDES[k].csv+'_'+q.id)));
  cb(T5,'cmp',T5.id);
  ['old','ours'].forEach(k=>A.forEach(q=>cb(q,k,SIDES[k].csv+'_'+q.id)));
  E.forEach(q=>cb(q,'cmp',q.id));
  D.forEach(q=>cb(q,'cmp',q.id));
  F.forEach(q=>cb(q,'cmp',q.id));
}
/* G_USED/G_UNUSED 는 참가자마다 한쪽만 응답이 있다 — 안 밟은 쪽은 N/A 로 찍는다.
   branchOf(row) 는 저장된 응답(row)의 G1b 값으로 그 참가자가 어느 쪽을 밟았는지 되짚는다 */
const branchOf=row=>(row.ans.cmp||{}).G1b?.v===0 ? 'used' : 'unused';
function fields(q){
  const f=[];
  if(q.type!=='obs') f.push(['',(a,m,r)=>{
    if(q.type==='pair') return null; /* pair 는 아래에서 r0/r1 두 열로 별도 처리 */
    if(q.type==='multi') return (a.v||[]).map(i=>i===-1?'기타':q.opts[i]).join(' | ');
    if(q.type==='choice'){
      if(a.v==null) return ''; if(a.v===-1) return '기타';
      const o=q.opts[a.v];
      if(q.orderOpts) return a.v===2?o:(q.dict||SIDES)[seqOf(r.order)[a.v]].csv;
      if(q.svcOpts) return NAME2CSV[o]||o;
      return o;
    }
    return a.v??'';
  }]);
  if(q.type==='pair'){
    f.length=0;
    const val=v=> v==null ? '' : (q.textVal ? q.labels[v-1] : v);
    f.push(['_기존',a=>val(a.r0)]);
    f.push(['_두번째',a=>val(a.r1)]);
  }
  if(q.other)  f.push(['_기타',a=>a.other||'']);
  if(q.follow) f.push(['_이유',a=>a.follow||'']);
  if(q.mod)    f.push(['_진행자',(a,m)=>Array.isArray(m)?m.join(' | '):(m||'')]);
  return f;
}
function csv(){
  const rows=load();
  if(!rows.length){ alert('저장된 응답이 없습니다.'); return; }
  const cols=['참가자','먼저','진행자','시작','종료'];
  walk((q,k,pre)=>fields(q).forEach(([s])=>cols.push(pre+s)));

  const cell=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines=[cols.join(',')];
  rows.forEach(r=>{
    const o=[r.p, SIDES[seqOf(r.order)[0]].csv, r.moderator||'', r.started||'', r.ended||''];
    const rBranch=branchOf(r);
    walk((q,k)=>{
      const skip=q.branch && q.branch!==rBranch;
      const a=(r.ans[k]||{})[q.id]||{}, m=(r.mod[k]||{})[q.id];
      fields(q).forEach(([,fn])=>o.push(skip?'N/A':fn(a,m,r)));
    });
    lines.push(o.map(cell).join(','));
  });
  const text='\ufeff'+lines.join('\n');
  const name=`정성평가_${new Date().toISOString().slice(0,10)}.csv`;

  /* 먼저 파일 저장을 시도한다 — 로컬 파일·배포한 링크 둘 다 여기서 끝난다.
     ⚠️ 아티팩트 뷰어만 페이지가 시작하는 다운로드를 막으므로, 그때는 복사창으로 넘어간다.
     호스트 이름으로 판정하지 않는다 — 배포 도메인이 늘 때마다 목록이 새기 때문이다. */
  if(saveFile(text, name)) return;
  showCsv(text, name);
}

/* 파일로 저장한다. 막힌 환경이면 false — 호출한 쪽이 복사창을 띄운다.
   이름이 saveFile 인 이유: save() 는 localStorage 저장이라 이미 쓰이고 있다 */
function saveFile(text, name){
  try{
    if(!('download' in document.createElement('a'))) return false;
    const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return true;
  }catch(e){ return false; }
}

/* 다운로드가 막힌 환경용 — 복사해서 쓰도록 띄운다 */
function showCsv(text, name){
  const bd=document.createElement('div');
  bd.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);'+
    'display:flex;align-items:center;justify-content:center;padding:16px';
  bd.innerHTML=`<div style="background:var(--surface);border-radius:var(--r);padding:18px;
      max-width:720px;width:100%;max-height:86vh;display:flex;flex-direction:column;gap:12px">
    <div><div style="font-size:17px;font-weight:700">CSV 내보내기</div>
    <div style="font-size:13px;color:var(--text-2);margin-top:4px">
      이 화면에서는 파일 저장이 막혀 있어요. 복사해서 엑셀이나 메모장에 붙여넣고
      <b>${esc(name)}</b> 로 저장하세요.</div></div>
    <textarea id="csvout" readonly style="flex:1;min-height:220px;font-family:ui-monospace,
      SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre">${esc(text)}</textarea>
    <div style="display:flex;gap:8px">
      <button class="btn btn-p" id="cp" style="flex:1">복사하기</button>
      <button class="btn btn-s" id="cl" style="flex:0 0 96px">닫기</button></div>
  </div>`;
  document.body.appendChild(bd);
  const ta=bd.querySelector('#csvout');
  bd.querySelector('#cp').onclick=async()=>{
    const b=bd.querySelector('#cp');
    try{ await navigator.clipboard.writeText(text); b.textContent='복사됐어요'; }
    catch(e){ ta.select(); b.textContent='직접 복사하세요'; }
    setTimeout(()=>{b.textContent='복사하기'},2200);
  };
  bd.querySelector('#cl').onclick=()=>bd.remove();
  bd.onclick=e=>{ if(e.target===bd) bd.remove(); };
}

render();
/* 입력·클릭마다 임시 저장 — 문항 안 이벤트 핸들러를 일일이 건드리지 않고 한 곳에서 잡는다 */
document.addEventListener('input', saveDraft);
document.addEventListener('click', ()=>setTimeout(saveDraft,0));
</script>
