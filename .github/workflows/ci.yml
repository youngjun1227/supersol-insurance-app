name: ci

# ⚠️ required status check 로 등록되므로 paths 필터를 두지 않는다 —
# 필터에 걸려 실행되지 않으면 체크가 영원히 pending 이 되어 병합 불가 (Ventry 교훈)
# 명세: docs/CI명세.md (2.0 — 승인 필수 해제에 맞춰 시각 회귀·협업 규칙 추가)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled — `기준선-갱신` 라벨이 붙는 순간 기준선을 다시 찍는다 (시각 회귀 job 참고)
    types: [opened, synchronize, reopened, labeled]
  # 기준선 갱신 커밋은 GITHUB_TOKEN 으로 push 되어 새 run 을 만들지 못한다 —
  # 갱신 job 이 직접 dispatch 해서 새 SHA 에 체크를 붙인다
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 빠른 검사 3종 — 서로 독립이라 병렬로 돈다 ─────────────
  # pre-commit 훅은 --no-verify 나 훅 미설정으로 우회 가능하다. CI 가 최종 방어선.

  tokens:
    name: 토큰 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 토큰 밖 hex·직접 font-size/radius·라이프 색·100vh
        run: npm run lint:tokens

  copy:
    name: 문구 컴플라이언스
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # pre-commit 과 같은 스크립트를 쓴다 (#108) — 검사가 두 벌이면 갈린다
      - name: 금칙어·실명·실번호
        run: node scripts/check-copy.mjs

      # 커밋 트레일러는 .githooks/commit-msg 가 막지만, 훅은 clone 후
      # `git config core.hooksPath .githooks` 를 해야 붙는다. 새 팀원이 빠뜨리면
      # 무방비라 CI 에서도 본다 (CLAUDE.md 최상위 규칙)
      - name: Claude 트레일러 금지
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1)"; HEAD="$(git rev-parse HEAD)"; fi
          if git log --format='%B' "$BASE..$HEAD" | grep -iE 'Co-Authored-By: Claude|Generated with .*Claude Code'; then
            echo "❌ 커밋 메시지에 Claude 트레일러가 있습니다 (CLAUDE.md 커밋 규칙)"
            exit 1
          fi
          echo "✓ 트레일러 없음"

  mock:
    name: 목데이터 정합성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 카테고리 분류를 AS-IS/TO-BE 섞어 넣었다가 화면에 "건강 7"이 뜨고서야 발견한 적이 있다
      - name: 원본 문서와 대조 (상품 26 · 보장 10 · 티어 4)
        run: npm run check:mock

  # ── 빌드 계열 — typecheck → build → 번들은 순서 의존이라 한 job ──
  build:
    name: 빌드·타입·번들
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # 폰으로 링크를 열어 하는 테스트라 초기 로딩이 곧 체감이다.
      # 아이콘을 이름으로 동적 조회했다가 317KB → 5.2MB 가 된 적이 있다
      - name: 번들 크기 (gzip JS 200KB / CSS 40KB)
        run: npm run check:bundle

  # ── 스모크 — 전 라우트가 throw·콘솔 에러 없이 뜨는가 (#81) ──
  smoke:
    name: 스모크 (전 라우트 렌더)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ 이 job 만 22 — jsdom 이 쓰는 undici 가 Node 20 과 비호환
          #    (markAsUncloneable 없음 에러로 워커가 아예 못 뜬다). 다른 job 은
          #    jsdom 을 안 쓰므로 20 유지 — 빌드 환경을 흔들지 않는다.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 라우트 29벌 렌더 (쿼리 상태 변형 포함)
        run: npm run test

  # ── 시각 회귀 — figma-ref 화면 25장이 승인된 기준선과 같은가 (명세 REQ-002~009) ──
  # 승인 없이 머지되므로(2026-09-04) "화면이 달라졌는가"를 사람이 아니라 이 job 이 본다.
  # WebKit 이 P0(참가자 전원 아이폰) · Chromium P1. 뷰포트 393×852 DPR 2 하나.
  # ⚠️ 엔진 ≠ 브랜드 — iOS 전용 결함(safe-area·fixed)은 못 잡는다. 폰 실기기 체크가 맡는다.
  visual:
    name: 시각 회귀 (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 기준선은 이 컨테이너에서만 찍는다 (REQ-006) — 버전은 package.json 의 @playwright/test 와 같아야 한다
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: write   # 기준선 갱신 커밋
      actions: write    # 갱신 뒤 재실행 dispatch
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          # 갱신 모드는 PR 브랜치 자체를 받아야 push 할 수 있다 (기본은 merge 커밋)
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: 기준선 갱신 여부
        id: mode
        run: |
          if [ "${{ github.event.action }}" = "labeled" ] && [ "${{ github.event.label.name }}" = "기준선-갱신" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 비교 (기준선 없으면 실패 — 라벨 `기준선-갱신`)
        if: steps.mode.outputs.update == 'false'
        run: npx playwright test --project=${{ matrix.engine }}
        env:
          CI: true
      - name: 기준선 다시 찍어 PR 브랜치에 커밋
        if: steps.mode.outputs.update == 'true'
        run: |
          npx playwright test --project=${{ matrix.engine }} --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__snapshots__
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "기준선 갱신 — ${{ matrix.engine }} (라벨 기준선-갱신)"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
        env:
          CI: true
      - name: 갱신 커밋에 체크 붙이기 (dispatch)
        if: steps.mode.outputs.update == 'true' && matrix.engine == 'chromium'
        run: gh workflow run ci.yml --ref "${{ github.event.pull_request.head.ref }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 실패 보고서 (expected · actual · diff)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ matrix.engine }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  # ── 협업 규칙 — 사람이 보던 것을 CI 가 본다 (명세 REQ-010·011) ──
  rules:
    name: 협업 규칙 (프리즈 · 공용 표면)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 9/10 00:00 KST 부터 main 프리즈 — hotfix 라벨 없는 PR 은 팀장도 막힌다 (CLAUDE.md 일정)
      - name: 프리즈 (9/10 이후는 hotfix 라벨)
        run: |
          FREEZE=$(date -u -d "2026-09-09T15:00:00Z" +%s)
          NOW=$(date -u +%s)
          HAS_HOTFIX="${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}"
          if [ "$NOW" -ge "$FREEZE" ] && [ "$HAS_HOTFIX" != "true" ]; then
            echo "❌ 9/10 부터 main 프리즈 — 핫픽스면 PR 에 hotfix 라벨을 붙이세요 (CLAUDE.md 일정)"
            exit 1
          fi
          echo "✓ 프리즈 아님 또는 hotfix"
      # 공용 표면은 팀장 소유 (CLAUDE.md 협업 규칙). 승인이 없어졌으니 여기서 본다 —
      # 팀장이 아닌 작성자가 건드리면 팀장이 `공용-허용` 라벨을 붙여야 통과
      - name: 공용 표면 (팀장 외 수정은 공용-허용 라벨)
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ALLOWED="${{ contains(github.event.pull_request.labels.*.name, '공용-허용') }}"
          if [ "$AUTHOR" = "youngjun1227" ] || [ "$ALLOWED" = "true" ]; then echo "✓ 팀장 또는 허용 라벨"; exit 0; fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | grep -E '^(src/components/|src/app/|src/pages/Home\.tsx|src/data/|src/styles/tokens\.css|src/lib/targetId\.ts)' || true)
          if [ -n "$CHANGED" ]; then
            echo "❌ 공용 표면은 팀장 소유입니다 — 필요하면 팀장에게 요청하세요 (CLAUDE.md 협업 규칙). 바뀐 파일:"
            echo "$CHANGED"
            exit 1
          fi
          echo "✓ 공용 표면 변경 없음"

  # ── 관문 job ──────────────────────────────────────────────
  # ⚠️ 브랜치 보호의 required status check 는 이름으로 매칭된다.
  # job 을 쪼개면 'ci' 라는 이름이 사라져 체크가 영원히 pending → 병합 불가.
  # 위 4개를 모아 'ci' 이름을 유지하는 관문을 둔다. 보호 설정을 건드릴 필요가 없다.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [tokens, copy, mock, build, smoke, visual, rules]
    if: always()
    steps:
      - name: 앞 단계 결과 확인
        run: |
          echo "토큰 lint:      ${{ needs.tokens.result }}"
          echo "문구 컴플라이언스: ${{ needs.copy.result }}"
          echo "목데이터 정합성:   ${{ needs.mock.result }}"
          echo "빌드·타입·번들:   ${{ needs.build.result }}"
          echo "스모크:          ${{ needs.smoke.result }}"
          echo "시각 회귀:       ${{ needs.visual.result }}"
          echo "협업 규칙:       ${{ needs.rules.result }}  (push 에선 skipped 가 정상)"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ 실패한 단계가 있습니다 — 위 목록에서 확인하세요."
            exit 1
          fi
          echo "✓ 전부 통과"
