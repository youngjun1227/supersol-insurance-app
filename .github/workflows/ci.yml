name: ci

# ⚠️ required status check 로 등록되므로 paths 필터를 두지 않는다 —
# 필터에 걸려 실행되지 않으면 체크가 영원히 pending 이 되어 병합 불가 (Ventry 교훈)
# 명세: docs/CI명세.md (2.0 — 승인 필수 해제에 맞춰 시각 회귀·협업 규칙 추가)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled — `기준선-갱신` 라벨이 붙는 순간 기준선을 다시 찍는다 (시각 회귀 job 참고)
    types: [opened, synchronize, reopened, labeled]
  # 기준선 갱신 커밋은 GITHUB_TOKEN 으로 push 되어 새 run 을 만들지 못한다 —
  # 갱신 job 이 직접 dispatch 해서 새 SHA 에 체크를 붙인다
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 빠른 검사 3종 — 서로 독립이라 병렬로 돈다 ─────────────
  # pre-commit 훅은 --no-verify 나 훅 미설정으로 우회 가능하다. CI 가 최종 방어선.

  tokens:
    name: 토큰 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 토큰 밖 hex·직접 font-size/radius·라이프 색·100vh
        run: npm run lint:tokens

  copy:
    name: 문구 컴플라이언스
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # pre-commit 과 같은 스크립트를 쓴다 (#108) — 검사가 두 벌이면 갈린다
      - name: 금칙어·실명·실번호
        run: node scripts/check-copy.mjs

      # 커밋 트레일러는 .githooks/commit-msg 가 막지만, 훅은 clone 후
      # `git config core.hooksPath .githooks` 를 해야 붙는다. 새 팀원이 빠뜨리면
      # 무방비라 CI 에서도 본다 (CLAUDE.md 최상위 규칙)
      - name: Claude 트레일러 금지
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1)"; HEAD="$(git rev-parse HEAD)"; fi
          if git log --format='%B' "$BASE..$HEAD" | grep -iE 'Co-Authored-By: Claude|Generated with .*Claude Code'; then
            echo "❌ 커밋 메시지에 Claude 트레일러가 있습니다 (CLAUDE.md 커밋 규칙)"
            exit 1
          fi
          echo "✓ 트레일러 없음"

  mock:
    name: 목데이터 정합성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 카테고리 분류를 AS-IS/TO-BE 섞어 넣었다가 화면에 "건강 7"이 뜨고서야 발견한 적이 있다
      - name: 원본 문서와 대조 (상품 26 · 보장 10 · 티어 4)
        run: npm run check:mock

  # ── 빌드 계열 — typecheck → build → 번들은 순서 의존이라 한 job ──
  build:
    name: 빌드·타입·번들
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # 폰으로 링크를 열어 하는 테스트라 초기 로딩이 곧 체감이다.
      # 아이콘을 이름으로 동적 조회했다가 317KB → 5.2MB 가 된 적이 있다
      - name: 번들 크기 (gzip JS 200KB / CSS 40KB)
        run: npm run check:bundle

  # ── 스모크 — 전 라우트가 throw·콘솔 에러 없이 뜨는가 (#81) ──
  smoke:
    name: 스모크 (전 라우트 렌더)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ 이 job 만 22 — jsdom 이 쓰는 undici 가 Node 20 과 비호환
          #    (markAsUncloneable 없음 에러로 워커가 아예 못 뜬다). 다른 job 은
          #    jsdom 을 안 쓰므로 20 유지 — 빌드 환경을 흔들지 않는다.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 라우트 29벌 렌더 (쿼리 상태 변형 포함)
        run: npm run test

  # ── 시각 회귀 — 9/11 테스트 이후로 미룬다 (2026-09-04 팀장) ──────────
  # 잡 정의는 뺐지만 도구 일체(playwright.config.ts · e2e/visual.spec.ts · npm run visual)는 남아 있다.
  # 되살리려면 이 자리에 visual job 을 다시 넣고 아래 ci 의 needs 에 visual 을 더한 뒤,
  # PR 에 라벨 `기준선-갱신` 을 붙여 기준선 50장(25화면 × webkit·chromium)을 처음 찍으면 된다.
  # 지금 끄는 이유 — 회귀 테스트는 "저번과 달라졌나"를 묻는 것이라 화면이 안정된 뒤에야 값이 나온다.
  # 9/11 까지 화면을 계속 만드는 중이라, 지금 켜면 기준선 갱신 잡일만 늘고 남은 가동 기간도 프리즈(9/10)까지 엿새뿐이다.
  # 게다가 첫 기준선을 검수 없이 찍으면 현재 화면이 그대로 "정답" 으로 굳어, figma-ref 와 어긋난 게 있어도 영영 못 잡는다.
  # ⚠️ 이 잡의 폰트 검사가 실제로 결함을 하나 잡았다 — 웹폰트가 "Pretendard Variable" 로 등록되는데
  #    토큰 스택에 그 이름이 없어 참가자 아이폰·CI 가 시스템 폰트로 렌더되고 있었다 (f201ab8 에서 수정).
  #    끄는 것은 회귀 비교이지 그 수정이 아니다.

  # ── 협업 규칙 — 사람이 보던 것을 CI 가 본다 (명세 REQ-010·011) ──
  rules:
    name: 협업 규칙 (프리즈 · 공용 표면)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # 공용 표면 알림을 PR 코멘트로 남긴다 — 저장소 기본 워크플로 권한이 read 라 여기서만 올린다
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 9/10 00:00 KST 부터 main 프리즈 — hotfix 라벨 없는 PR 은 팀장도 막힌다 (CLAUDE.md 일정)
      - name: 프리즈 (9/10 이후는 hotfix 라벨)
        run: |
          FREEZE=$(date -u -d "2026-09-09T15:00:00Z" +%s)
          NOW=$(date -u +%s)
          HAS_HOTFIX="${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}"
          if [ "$NOW" -ge "$FREEZE" ] && [ "$HAS_HOTFIX" != "true" ]; then
            echo "❌ 9/10 부터 main 프리즈 — 핫픽스면 PR 에 hotfix 라벨을 붙이세요 (CLAUDE.md 일정)"
            exit 1
          fi
          echo "✓ 프리즈 아님 또는 hotfix"
      # 공용 표면은 팀장 소유 (CLAUDE.md 협업 규칙) — 다만 **막지 않고 알리기만 한다**.
      # 2026-09-05 팀장: 팀원이 공용 컴포넌트를 건드릴 일이 실제로 잦았고(#148 AgentBubble ·
      # #156 AppShell · #158 ProductFilters), 막아 두니 라벨을 기다리다 PR 이 쌓이거나
      # 빨간 X 를 그냥 지나쳐 머지됐다 — 마찰만 남고 보호 효과는 없는 상태였다.
      # 시각 검수를 머지 뒤 사후에 하기로 한 결정(2026-09-04)과도 결이 맞다.
      # 소유권 규칙 자체는 유지된다 — 여기서 남긴 코멘트로 팀장이 사후에 본다.
      - name: 공용 표면 (팀장 외 수정은 알림만)
        if: github.event.pull_request.user.login != 'youngjun1227'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | grep -E '^(src/components/|src/app/|src/pages/Home\.tsx|src/data/|src/styles/tokens\.css|src/lib/targetId\.ts)' || true)
          if [ -z "$CHANGED" ]; then echo "✓ 공용 표면 변경 없음"; exit 0; fi

          echo "⚠️ 공용 표면이 바뀌었습니다 (막지는 않습니다):"
          echo "$CHANGED"
          # 워크플로 요약에도 남긴다 — 코멘트 권한이 없어도 여기서는 보인다
          {
            echo "### ⚠️ 공용 표면 변경"
            echo "공용 표면은 팀장 소유입니다 (CLAUDE.md 협업 규칙). **막지는 않으니 그대로 진행하세요** — 팀장이 머지 뒤 확인합니다."
            echo ""
            echo '```'
            echo "$CHANGED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # PR 코멘트는 실패해도 무시한다 (fork PR 은 토큰이 읽기 전용이다)
          {
            echo "⚠️ **공용 표면 변경 알림** — 막지 않습니다. 그대로 진행하세요."
            echo ""
            echo "아래 파일은 CLAUDE.md 협업 규칙상 팀장 소유입니다. 팀장이 머지 뒤 main 프리뷰에서 확인합니다."
            echo "크기·비율이 갈릴 수 있는 변경이면 팀장에게 한 줄 알려주세요."
            echo ""
            echo '```'
            echo "$CHANGED"
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md \
            --repo "${{ github.repository }}" || echo "(코멘트 실패 — 요약에만 남김)"

  # ── 관문 job ──────────────────────────────────────────────
  # ⚠️ 브랜치 보호의 required status check 는 이름으로 매칭된다.
  # job 을 쪼개면 'ci' 라는 이름이 사라져 체크가 영원히 pending → 병합 불가.
  # 위 4개를 모아 'ci' 이름을 유지하는 관문을 둔다. 보호 설정을 건드릴 필요가 없다.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [tokens, copy, mock, build, smoke, rules]
    if: always()
    steps:
      - name: 앞 단계 결과 확인
        run: |
          echo "토큰 lint:      ${{ needs.tokens.result }}"
          echo "문구 컴플라이언스: ${{ needs.copy.result }}"
          echo "목데이터 정합성:   ${{ needs.mock.result }}"
          echo "빌드·타입·번들:   ${{ needs.build.result }}"
          echo "스모크:          ${{ needs.smoke.result }}"
          echo "협업 규칙:       ${{ needs.rules.result }}  (push 에선 skipped 가 정상)"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ 실패한 단계가 있습니다 — 위 목록에서 확인하세요."
            exit 1
          fi
          echo "✓ 전부 통과"
